[project]
name = "statcast-pipeline"
version = "0.1.0"
description = "ELT pipeline for MLB Statcast pitch data: Baseball Savant -> Parquet -> DuckDB -> dbt"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
