version: 2

models:
  - name: int_called_pitches
    description: >
      Pitches with no swing (called strikes and balls), scored against the rulebook
      zone padded by the ball's radius, with the home-plate umpire attached. Grain: pitch.
    columns:
      - name: pitch_id
        data_tests: [unique, not_null]
      - name: is_correct_call
        data_tests: [not_null]
      - name: miss_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["missed_strike", "missed_ball"]
      - name: umpire_id
        description: Null when the umpire extract found no home-plate umpire for the game.
        data_tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">1000"
