version: 2

sources:
  - name: raw
    description: Raw tables loaded by statcast_pipeline/load.py from the Parquet lake.
    schema: raw
    tables:
      - name: pitches
        description: One row per pitch as returned by Baseball Savant, plus load metadata (_extracted_at, _source, dt).
        loaded_at_field: _extracted_at
        # `dbt source freshness` will warn in the off-season; that's expected.
        freshness:
          warn_after: {count: 2, period: day}
        columns:
          - name: game_pk
            data_tests:
              - not_null

      - name: games
        description: One row per scheduled game from the MLB Stats API schedule endpoint.

      - name: game_officials
        description: Umpire assignments per game (hydrate=officials, with a boxscore fallback).

      - name: players
        description: Chadwick Bureau player register (names and cross-site IDs), via pybaseball.
