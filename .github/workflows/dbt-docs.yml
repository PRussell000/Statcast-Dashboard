# Publishes the dbt documentation site (models, columns, tests, lineage graph)
# to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # dbt docs need a built warehouse for column types; sample data is enough.
      - name: Build sample warehouse
        run: python -m statcast_pipeline.run --sample --start 2024-06-01 --end 2024-06-07 --skip-publish

      - name: Generate static docs
        env:
          WAREHOUSE_PATH: warehouse/sample.duckdb
        run: |
          dbt docs generate --static --project-dir dbt --profiles-dir dbt --vars '{allow_sample: true}'
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
