name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      # CI has no reason to hit Baseball Savant, so the full pipeline runs on
      # generated sample data. This still proves extract -> load -> dbt build works.
      - name: Pipeline + dbt build on sample data
        run: python -m statcast_pipeline.run --sample --start 2024-06-01 --end 2024-06-07
